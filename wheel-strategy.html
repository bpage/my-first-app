document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.ftr-space { display: table-cell; height: 0.6in !important; }\n    h1, h2, h3, h4, h5, h6 { break-after: avoid; }\n    figure, pre, blockquote, .card, .stepflow, .example { break-inside: avoid; }\n    p, li { orphans: 3; widows: 3; }\n    .screen-only { display: none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<main class=\"doc\">\n<table class=\"doc-frame\" role=\"presentation\">\n<thead><tr><td class=\"hdr-space\"><\u002Ftd><\u002Ftr><\u002Fthead>\n<tbody><tr><td>\n\n<div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:24px; border-bottom:1px solid #e6e5e1; padding-bottom:18px; margin-bottom:34px;\">\n  <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#7a7a72; font-weight:600;\">Income Options Playbook<\u002Fdiv>\n  <div style=\"font-size:12px; letter-spacing:0.04em; color:#9a9a90;\">June 2026<\u002Fdiv>\n<\u002Fdiv>\n\n<h1 style=\"font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:42px; line-height:1.08; letter-spacing:-0.015em; margin:0 0 16px;\">OG's Wheel Strategy<\u002Fh1>\n<p style=\"font-size:18px; line-height:1.5; color:#44443e; max-width:62ch; margin:0 0 8px;\">A simple, repeatable way to generate cash income by selling <strong style=\"font-weight:600;\">weekly options<\u002Fstrong> at a conservative <strong style=\"font-weight:600;\">0.15 delta<\u002Fstrong> on quality stocks you'd be happy to own — applied to a hot, liquid AI &amp; data-center infrastructure name.<\u002Fp>\n\n<!-- WHAT IT IS -->\n<h2 style=\"font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:23px; margin:40px 0 12px; letter-spacing:-0.01em;\">What it is<\u002Fh2>\n<p style=\"font-size:15.5px; line-height:1.65; color:#33332e; max-width:66ch; margin:0 0 12px;\">The Wheel is a two-part cycle. You get paid an upfront <strong style=\"font-weight:600;\">premium<\u002Fstrong> at every step. As long as you only run it on stocks you genuinely want to own at the price you choose, the worst case is that you end up holding a good company you bought at a discount.<\u002Fp>\n\n<!-- CYCLE -->\n<div class=\"stepflow\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:24px 0 8px;\">\n  <div class=\"card\" style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:20px 22px;\">\n    <div style=\"display:flex; align-items:center; gap:11px; margin-bottom:9px;\">\n      <div style=\"width:26px; height:26px; border-radius:50%; background:oklch(0.55 0.09 165); color:#fff; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center;\">1<\u002Fdiv>\n      <div style=\"font-weight:600; font-size:15.5px;\">Sell a cash-secured put<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; line-height:1.6; color:#52524b; margin:0;\">Each week, pick a strike well below the market — around <strong style=\"font-weight:600;\">0.15 delta<\u002Fstrong>, meaning roughly an <strong style=\"font-weight:600;\">85% chance<\u002Fstrong> it expires worthless. Sell the put and collect premium. Stays above? Keep the cash and repeat next week. Drops below? You buy 100 shares at your discount.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:20px 22px;\">\n    <div style=\"display:flex; align-items:center; gap:11px; margin-bottom:9px;\">\n      <div style=\"width:26px; height:26px; border-radius:50%; background:oklch(0.55 0.09 165); color:#fff; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center;\">2<\u002Fdiv>\n      <div style=\"font-weight:600; font-size:15.5px;\">Sell a covered call<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; line-height:1.6; color:#52524b; margin:0;\">Now you own 100 shares. Each week, sell a call about <strong style=\"font-weight:600;\">0.15 delta<\u002Fstrong> above your cost and collect premium. Rises through it? Your shares sell at a profit and you restart at Step 1. If not, keep the premium and sell another next week.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:13.5px; line-height:1.55; color:#86867c; margin:6px 0 0; text-align:center;\">↺ &nbsp;Repeat the cycle. Every turn — whether assigned or not — you pocket premium.<\u002Fp>\n\n<!-- WORKED EXAMPLE -->\n<h2 style=\"font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:23px; margin:38px 0 14px; letter-spacing:-0.01em;\">A worked example<\u002Fh2>\n<div class=\"example\" style=\"background:oklch(0.97 0.012 165); border:1px solid oklch(0.9 0.02 165); border-radius:12px; padding:24px 26px;\">\n  <div style=\"font-size:13px; letter-spacing:0.04em; color:oklch(0.45 0.07 165); font-weight:600; margin-bottom:16px;\">ILLUSTRATIVE — $NBIS (Nebius), ~$285 · weekly · ~0.15 delta · IV ~143%<\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:auto 1fr; gap:10px 18px; font-size:14.5px; line-height:1.5;\">\n    <div style=\"color:#76766c; font-weight:600;\">Step 1 · Sell put<\u002Fdiv>\n    <div style=\"color:#2a2a26;\">$NBIS is near $285. With IV running ~143%, next Friday's <strong style=\"font-weight:600;\">$240 put<\u002Fstrong> sits at ~0.15 delta and pays <strong style=\"font-weight:600;\">$4.30<\u002Fstrong> → collect <strong style=\"font-weight:600;\">$430<\u002Fstrong> today. Set aside <strong style=\"font-weight:600;\">$24,000<\u002Fstrong> in cash as collateral (1 contract = 100 shares).<\u002Fdiv>\n    <div style=\"color:#76766c; font-weight:600;\">Outcome A — stays above $240<\u002Fdiv>\n    <div style=\"color:#2a2a26;\">The put expires worthless (the ~85% case at 0.15 delta). Keep the full <strong style=\"font-weight:600;\">$430<\u002Fstrong> — about <strong style=\"font-weight:600;\">1.8% on collateral in one week<\u002Fstrong> — and sell another for next Friday. Repeated weekly, that's the income engine.<\u002Fdiv>\n    <div style=\"color:#76766c; font-weight:600;\">Outcome B — drops below $240<\u002Fdiv>\n    <div style=\"color:#2a2a26;\">You're assigned: buy 100 shares at $240. Because you pocketed $4.30, your real cost basis is <strong style=\"font-weight:600;\">$235.70<\u002Fstrong> — well below where it was trading when you started.<\u002Fdiv>\n    <div style=\"color:#76766c; font-weight:600;\">Step 2 · Sell call<\u002Fdiv>\n    <div style=\"color:#2a2a26;\">Now holding 100 shares, sell next Friday's <strong style=\"font-weight:600;\">$290 call<\u002Fstrong> (~0.15 delta) for <strong style=\"font-weight:600;\">$4.50<\u002Fstrong> → collect another <strong style=\"font-weight:600;\">$450<\u002Fstrong>, and repeat weekly while you hold.<\u002Fdiv>\n    <div style=\"color:#76766c; font-weight:600;\">Called away at $290<\u002Fdiv>\n    <div style=\"color:#2a2a26;\">Shares sell at $290 vs. your $240 basis: <strong style=\"font-weight:600;\">$5,000<\u002Fstrong> in stock gains <em>plus<\u002Fem> the <strong style=\"font-weight:600;\">$880<\u002Fstrong> of put + call premium = <strong style=\"font-weight:600;\">~$5,880 total<\u002Fstrong>. The wheel turns and you start again at Step 1.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- DELTA NOTE -->\n<div style=\"display:flex; gap:13px; align-items:flex-start; margin:16px 2px 0;\">\n  <div style=\"font-family:'Newsreader',Georgia,serif; font-style:italic; font-size:22px; color:oklch(0.55 0.09 165); line-height:1; margin-top:2px;\">Δ<\u002Fdiv>\n  <p style=\"margin:0; font-size:13.5px; line-height:1.6; color:#6a6a62; max-width:64ch;\"><strong style=\"font-weight:600; color:#4a4a44;\">Why 0.15 delta?<\u002Fstrong> An option's delta roughly equals its chance of finishing in the money. At 0.15, there's only about a 15% chance you get assigned — so ~85% of the time you simply keep the premium. It's the conservative, high-probability lane: smaller premium per trade, but you bank it far more often.<\u002Fp>\n<\u002Fdiv>\n\n<!-- RETURN STRIP -->\n<div class=\"example\" style=\"margin-top:16px;\">\n  <div style=\"font-size:13px; letter-spacing:0.04em; color:#76766c; font-weight:600; margin-bottom:14px;\">PREMIUM RETURN ON COLLATERAL — per contract ($430/wk on $24,000)<\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;\">\n    <div style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:16px 18px;\">\n      <div style=\"font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#9a9a90; font-weight:600; margin-bottom:6px;\">Weekly<\u002Fdiv>\n      <div style=\"font-family:'Newsreader',Georgia,serif; font-size:30px; font-weight:500; color:oklch(0.5 0.09 165); line-height:1;\">1.8%<\u002Fdiv>\n      <div style=\"font-size:13px; color:#76766c; margin-top:4px;\">$430<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:16px 18px;\">\n      <div style=\"font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#9a9a90; font-weight:600; margin-bottom:6px;\">Monthly<\u002Fdiv>\n      <div style=\"font-family:'Newsreader',Georgia,serif; font-size:30px; font-weight:500; color:oklch(0.5 0.09 165); line-height:1;\">~7.8%<\u002Fdiv>\n      <div style=\"font-size:13px; color:#76766c; margin-top:4px;\">~$1,860 · 4.3 wks<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:16px 18px;\">\n      <div style=\"font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#9a9a90; font-weight:600; margin-bottom:6px;\">Annualized<\u002Fdiv>\n      <div style=\"font-family:'Newsreader',Georgia,serif; font-size:30px; font-weight:500; color:oklch(0.5 0.09 165); line-height:1;\">~93%<\u002Fdiv>\n      <div style=\"font-size:13px; color:#76766c; margin-top:4px;\">~$22,360 · 52 wks<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:12.5px; line-height:1.55; color:#9a9a90; margin:12px 0 0;\">Best-case ceiling, not a forecast: assumes the put expires worthless every week at a steady $430. Real returns fall with assignment, lower IV, missed weeks, or commissions — and this counts put premium only, before any covered-call income.<\u002Fp>\n<\u002Fdiv>\n\n<!-- WEEKLY VS MONTHLY -->\n<h2 style=\"font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:23px; margin:38px 0 12px; letter-spacing:-0.01em;\">Why weekly beats monthly<\u002Fh2>\n<p style=\"font-size:15.5px; line-height:1.65; color:#33332e; max-width:66ch; margin:0 0 16px;\">Selling the same 0.15-delta position every week instead of once a month changes the math in your favor on three fronts:<\u002Fp>\n<div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;\">\n  <div class=\"card\" style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:18px 19px;\">\n    <div style=\"font-weight:600; font-size:14.5px; margin-bottom:7px; color:#22221e;\">Faster time decay<\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.55; color:#56564f;\">An option loses value fastest in its final days (theta accelerates near expiry). Weeklies live almost entirely in that steep zone, so you harvest decay more efficiently — roughly 4 weekly premiums beat 1 monthly of the same delta.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:18px 19px;\">\n    <div style=\"font-weight:600; font-size:14.5px; margin-bottom:7px; color:#22221e;\">More control<\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.55; color:#56564f;\">You reset strikes every Friday to the current price and re-pick 0.15 delta. Less time committed per trade means less can go wrong before you adjust, roll, or step aside around earnings and news.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"background:#fff; border:1px solid #e6e5e1; border-radius:10px; padding:18px 19px;\">\n    <div style=\"font-weight:600; font-size:14.5px; margin-bottom:7px; color:#22221e;\">Compounding cadence<\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.55; color:#56564f;\">~52 income cycles a year instead of 12. Premiums collected weekly can be redeployed sooner, and a string of small, high-probability wins compounds faster than a few larger ones.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:13px; line-height:1.55; color:#86867c; margin:12px 0 0; max-width:66ch;\">The trade-off: more transactions to manage and more commissions — fine in a deeply liquid name like an AI-infra leader, less so in thinly traded stocks.<\u002Fp>\n\n<!-- SECTOR -->\n<h2 style=\"font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:23px; margin:38px 0 12px; letter-spacing:-0.01em;\">Why a hot sector like AI &amp; infra fits<\u002Fh2>\n<p style=\"font-size:15.5px; line-height:1.65; color:#33332e; max-width:66ch; margin:0 0 14px;\">The Wheel runs on two fuels: <strong style=\"font-weight:600;\">premium<\u002Fstrong> and <strong style=\"font-weight:600;\">liquidity<\u002Fstrong>. High-attention sectors deliver both — but the discipline is to wheel only names you'd hold for years.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px 28px;\">\n  <div style=\"display:flex; gap:11px; align-items:flex-start;\"><div style=\"width:7px; height:7px; border-radius:50%; background:oklch(0.55 0.09 165); margin-top:7px; flex:none;\"><\u002Fdiv><p style=\"margin:0; font-size:14.5px; line-height:1.55; color:#3a3a34;\"><strong style=\"font-weight:600;\">Rich premium.<\u002Fstrong> Elevated volatility (chips, GPUs, data-center buildout) means fatter option prices — you're paid more to wait.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex; gap:11px; align-items:flex-start;\"><div style=\"width:7px; height:7px; border-radius:50%; background:oklch(0.55 0.09 165); margin-top:7px; flex:none;\"><\u002Fdiv><p style=\"margin:0; font-size:14.5px; line-height:1.55; color:#3a3a34;\"><strong style=\"font-weight:600;\">Deep liquidity.<\u002Fstrong> Tight bid-ask spreads and weekly expirations let you enter, exit, and roll cleanly.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex; gap:11px; align-items:flex-start;\"><div style=\"width:7px; height:7px; border-radius:50%; background:oklch(0.55 0.09 165); margin-top:7px; flex:none;\"><\u002Fdiv><p style=\"margin:0; font-size:14.5px; line-height:1.55; color:#3a3a34;\"><strong style=\"font-weight:600;\">Durable demand.<\u002Fstrong> Pick businesses with real earnings and a long runway — not speculative pops you wouldn't want to be assigned.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex; gap:11px; align-items:flex-start;\"><div style=\"width:7px; height:7px; border-radius:50%; background:oklch(0.55 0.09 165); margin-top:7px; flex:none;\"><\u002Fdiv><p style=\"margin:0; font-size:14.5px; line-height:1.55; color:#3a3a34;\"><strong style=\"font-weight:600;\">Right-size it.<\u002Fstrong> A $240 put ties up $24k in collateral per contract. Make sure one assignment fits your account, or use a lower-priced name.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- RISK -->\n<h2 style=\"font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:23px; margin:36px 0 12px; letter-spacing:-0.01em;\">Mind the risk<\u002Fh2>\n<p style=\"font-size:15px; line-height:1.65; color:#44443e; max-width:68ch; margin:0;\">The Wheel caps your upside (a call sells your winners early) but <em>not<\u002Fem> your downside — if the stock falls hard, you own it through the drop. The same volatility that pays well can hurt. Protect yourself: only wheel companies you'd hold anyway, keep position sizes modest, and never deploy capital you can't leave committed. Premium softens the fall; it doesn't prevent it.<\u002Fp>\n\n<!-- DISCLAIMER -->\n<p style=\"font-size:12px; line-height:1.55; color:#9a9a90; margin:34px 0 0; padding-top:16px; border-top:1px solid #e6e5e1;\">This document is for educational purposes only and is not financial, investment, or tax advice. Options involve substantial risk and are not suitable for every investor. Figures are illustrative, not recommendations. Consult a licensed professional before trading.<\u002Fp>\n\n<\u002Ftd><\u002Ftr><\u002Ftbody>\n<tfoot><tr><td class=\"ftr-space\"><\u002Ftd><\u002Ftr><\u002Ftfoot>\n<\u002Ftable>\n<\u002Fmain>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
